  <rect x="8" y="8" width="164" height="164" rx="32" fill="#e8729e"/>
  <text
    x="90"
    y="123"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="108"
    font-weight="700"
    fill="white"
    opacity="0.97"
  >A</text>
  <text
    x="90"
    y="155"
    text-anchor="middle"
    font-size="26"
    fill="white"
    opacity="0.70"
  >♥</text>
</svg>
